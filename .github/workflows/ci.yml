name: CI

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Cross-platform build + test ──
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
        components: clippy

    - name: Install cross-compiler (ARM64)
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Set cross-compiler env (ARM64)
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
        echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV
        echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: cargo check
      run: cargo check --workspace

    - name: cargo test
      run: cargo test --workspace

    - name: cargo clippy
      run: cargo clippy --workspace -- -D warnings

    - name: Build release binary
      run: cargo build --release --target ${{ matrix.target }}

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: sa-monopoly-${{ matrix.target }}
        path: target/${{ matrix.target }}/release/sa-monopoly-cli${{ matrix.ext }}
        if-no-files-found: ignore

  # ── Auto PR: all platforms pass on feature branch → create PR to main ──
  auto-pr:
    name: Auto PR to main
    needs: build
    if: >
      github.ref != 'refs/heads/main' &&
      github.ref != 'refs/heads/master' &&
      !startsWith(github.ref, 'refs/tags/') &&
      github.event_name == 'push' &&
      success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Create PR to main
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: ${{ github.ref_name }}
          title: "Auto PR: ${{ github.ref_name }} → main"
          body: |
            ## Auto-generated PR

            Branch `${{ github.ref_name }}` has passed CI on all 4 platforms.

            - Commit: ${{ github.sha }}
            - Author: ${{ github.triggering_actor }}

            ✅ Linux x64
            ✅ Windows x64
            ✅ Linux ARM64
            ✅ macOS x64

            Click "Merge pull request" to merge if review is complete.
          labels: auto-pr
